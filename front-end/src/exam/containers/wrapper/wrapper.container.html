<ng-container *ngIf="examInfoA && !examInfoA.loading">
    <div class="row layout-sub-header">
        <div class="col">
            <p>Exam:&nbsp;<span #examName>{{examInfoA.data?.name}}</span></p>
        </div>
    </div>
    <router-outlet></router-outlet>
</ng-container>
<ng-container *ngIf="!examInfoA || examInfoA.loading">
    <div class="loading-container">
        <div class="loading-spinner"></div>
        <p>Зареждане...</p>
    </div>
</ng-container>
