<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h2>🔐 Добре дошли!</h2>
      <p>Влезте в своя профил</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="login(loginForm.value)">
      <!-- Error Alert -->
      <div *ngIf="loginService.error" class="error-alert">
        <span>⚠️ Грешно имейл или парола!</span>
      </div>

      <!-- Email Field -->
      <div class="form-group">
        <label for="email">📧 Имейл</label>
        <input
          formControlName="email"
          type="email"
          id="email"
          placeholder="your@email.com"
          [class.error]="controls.email.touched && controls.email.errors"
        />
        <span *ngIf="controls.email.touched && controls.email.errors?.['required']" class="error-text">
          Имейлът е задължителен
        </span>
        <span *ngIf="controls.email.touched && controls.email.errors?.['email']" class="error-text">
          Въведете валиден имейл
        </span>
      </div>

      <!-- Password Field -->
      <div class="form-group">
        <label for="password">🔑 Парола</label>
        <input
          formControlName="password"
          type="password"
          id="password"
          placeholder="••••••••"
          [class.error]="controls.password.touched && controls.password.errors"
        />
        <span *ngIf="controls.password.touched && controls.password.errors?.['required']" class="error-text">
          Паролата е задължителна
        </span>
      </div>

      <!-- Submit Button -->
      <button type="submit" [disabled]="loginForm.invalid" class="login-btn">
        🚀 Вход
      </button>

      <!-- Register Link -->
      <div class="register-link">
        <span>Нямате профил? </span>
        <a routerLink="/register">Създайте един тук!</a>
      </div>
    </form>
  </div>
</div>
