<div class="register-container">
  <div class="register-card">
    <div class="register-header">
      <h2>📝 Регистрация</h2>
      <p>Създайте своя профил</p>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="register(registerForm.value)">
      <!-- Name Field -->
      <div class="form-group">
        <label for="name">👤 Име</label>
        <input
          formControlName="name"
          type="text"
          id="name"
          placeholder="Вашето име"
          [class.error]="controls.name.touched && controls.name.errors"
        />
        <span *ngIf="controls.name.touched && controls.name.errors?.['required']" class="error-text">
          Името е задължително
        </span>
      </div>

      <!-- Email Field -->
      <div class="form-group">
        <label for="email">📧 Имейл</label>
        <input
          formControlName="email"
          type="email"
          id="email"
          placeholder="your@email.com"
          [class.error]="controls.email.touched && controls.email.errors"
        />
        <span *ngIf="controls.email.touched && controls.email.errors?.['required']" class="error-text">
          Имейлът е задължителен
        </span>
        <span *ngIf="controls.email.touched && controls.email.errors?.['email']" class="error-text">
          Въведете валиден имейл
        </span>
      </div>

      <!-- Password Field -->
      <div class="form-group">
        <label for="password">🔑 Парола</label>
        <input
          formControlName="password"
          type="password"
          id="password"
          placeholder="••••••••"
          [class.error]="controls.password.touched && controls.password.errors"
        />
        <span *ngIf="controls.password.touched && controls.password.errors?.['required']" class="error-text">
          Паролата е задължителна
        </span>
      </div>

      <!-- Submit Button -->
      <button type="submit" [disabled]="registerForm.invalid" class="register-btn">
        ✨ Създай профил
      </button>

      <!-- Login Link -->
      <div class="login-link">
        <span>Вече имате профил? </span>
        <a routerLink="/login">Влезте тук!</a>
      </div>
    </form>
  </div>
</div>
